version: "3.9"

services:
  postgres:
    image: postgres:17.6
    restart: always

    environment:
      POSTGRES_DB: SHORTCUTS
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sql123
    
    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seed:/docker-entrypoint-initdb.d
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
      - ./internal/infra/security/keys:/app/internal/infra/security/keys

volumes:
  postgres_data: